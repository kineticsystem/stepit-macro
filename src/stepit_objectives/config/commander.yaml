# The parameters of the commander server for the StepIt macro rig, loaded
# after the server's own: the behaviors and the objectives it runs. Passed to
# the launch file of stepit_server as params_file.
/**:
  ros__parameters:

    # Folders, given as "package_name/subfolder", holding the behaviors to load.
    plugins:
      - stepit_behaviors/bt_plugins

    # Folders, given as "package_name/subfolder", holding the trees to load:
    # the objectives a client can ask for, and the subtrees they are built from.
    behavior_trees:
      - stepit_objectives/objectives
