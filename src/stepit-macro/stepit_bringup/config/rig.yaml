# The configuration of the whole rig: the one file to edit to set it up, e.g.
# the serial ports of the controllers. rig.launch.py reads it when the rig
# starts: restart the rig to apply a change, no build is needed.
#
# It has two parts:
#
# - `launch`: the launch arguments of each module, given to its launch file.
#   An argument the launch file does not declare stops the rig, so that a typo
#   is not silently ignored.
# - every other section: the parameters of a node, as in any ROS2 parameter
#   file. The launch file gives them to the commander, the camera and the
#   Freezer as their `params_file`, loaded after the module's own: only the
#   values that differ from the module's need to be here. A launch argument
#   that sets the same parameter, e.g. the Freezer's usb_port, wins.
#
# The serial ports are best named by /dev/serial/by-id, e.g.
# /dev/serial/by-id/usb-Teensyduino_USB_Serial_12345-if00: /dev/ttyACM0 and
# /dev/ttyUSB0 depend on which controller was plugged in first. List them with
# `ls -l /dev/serial/by-id`.

launch:
  # StepIt Motors, the robot: robot_bringup/launch.py.
  robot:
    # Fake motors, or the microcontroller on usb_port.
    use_dummy: true
    usb_port: /dev/ttyACM0
    baud_rate: 9600
    # RViz, on the host's display.
    launch_rviz: false

  # StepIt Commander, the action server running the objectives, and the
  # rosbridge the editor reaches it through: stepit_server/commander.launch.py.
  commander:
    rosbridge_port: 9090

  # StepIt Camera, the camera on USB, found by libgphoto2: there is no port to
  # set. stepit_camera/camera.launch.py.
  camera:
    fake: false
    stream: false
    web_port: 8090        # the pictures, which StepIt UI loads from here
    web_video_port: 8081  # the live view
    # StepIt UI reaches the camera through the commander's rosbridge, which
    # knows every message of the rig: the camera's own is not needed.
    rosbridge: false

  # StepIt Freezer, the board that fires the cameras and the flashes:
  # freezer_node/freezer.launch.py.
  freezer:
    # A fake controller, or the Arduino Nano on usb_port.
    use_fake: true
    usb_port: /dev/ttyUSB0
    # The board page, and its rosbridge: StepIt UI replaces it.
    web: false

  # The gamepad: stepit_teleop/teleop.launch.py.
  teleop:
    dev: /dev/input/js0

  # StepIt UI, the application of the rig, for a tablet or a desktop: static
  # files, which talk to the rig through the commander's rosbridge.
  ui:
    port: 8070

  # StepIt Editor, the web editor of the objectives, which opens the rig's own.
  # Not a launch file: these are the only arguments it takes.
  editor:
    port: 8080

# The commander: the behaviors and the trees it loads, as
# "package_name/subfolder".
stepit_server:
  ros__parameters:
    plugins:
      - stepit_behaviors/bt_plugins
    behavior_trees:
      - stepit_objectives/objectives

    # The parameters of the rig's behaviors, which the plugin declares on the
    # commander's node: the commander itself knows nothing about them.
    #
    # Backlash: a move that approaches its position against the direction of
    # the stack, e.g. the rail back to the near mark, first goes this far past
    # it, in radians of the motor, then back. It must exceed the backlash of
    # each axis. Estimates, a tenth of a turn for the rail and a twentieth for
    # the stage, until measured: see TODO.md.
    overshoot:
      joint1: 0.31  # the rotary stage
      joint2: 0.63  # the rail
    # Where MarkNear and MarkFar save the ends of a stack, for FocusStack: state,
    # not configuration, in the repo's state folder, which git ignores.
    state_file: ~/ws/state/stack.yaml

# The camera, and its web server, which serves the pictures from the same
# folder. The repo is mounted at ~/ws: the pictures land in its `pictures`
# folder on the host. See camera.yaml of StepIt Camera for the other
# parameters, e.g. the settings applied to the camera when it connects.
camera:
  ros__parameters:
    download_directory: &pictures ~/ws/pictures
    # iso: "400"
    # shutter_speed: "1/125"
    # aperture: "8"

# The camera's web server, which serves the pictures to StepIt UI, from the
# same folder. Its test page is not built in the rig.
web_server:
  ros__parameters:
    download_directory: *pictures

# The Freezer: see freezer.yaml of StepIt Freezer for its parameters. use_fake
# and usb_port are launch arguments, above.
freezer:
  ros__parameters:
    baudrate: 9600
    # The sequences of the rig, by the jacks of its board: the camera is on
    # OUT8, the lights on OUT1; the other jacks are free. A sequence the rig
    # does not list here is unknown to the node.
    default_sequence: test_shot
    sequence_names: [test_shot]
    sequences:
      # Focus the camera, open its shutter, switch the lights on and off, then
      # release the camera. The exposure must last until the lights are off,
      # about 0.9 s after the shutter line closes: a shorter one is over before
      # the lights come on. The durations are in milliseconds.
      test_shot:
        recipe: timed_light
        cameras: [8]
        lights: [1]
        focus_ms: 100.0
        shutter_to_light_ms: 500.0
        light_ms: 200.0
        light_to_close_ms: 200.0
        cooldown_ms: 200.0

# The sliders of StepIt UI, which drive the joints as the gamepad's sticks do:
# the page sends each slider as an axis of a sensor_msgs/Joy on /ui/joy, from -1
# to 1, and this second gamepad_teleop turns them into velocities. The ends of a
# slider are the rail's top speed, the motors' limit, 3 turns/s, and a quarter of
# it, 0.75 turns/s, for the rotary stage, which the subject turns on. StepIt UI
# shows these speeds under its sliders (SLIDERS in its motion/store.ts): keep
# them in step. When the page stops sending for
# joy_timeout seconds during a move, e.g. when the tablet loses the network,
# the joints stop.
ui_teleop:
  ros__parameters:
    stop_button: -1  # none: the page runs ActivateTeleop through the commander
    controller: velocity_controller
    joints: [joint1, joint2, joint3, joint4, joint5]
    joint1: { axis: 0, scale: 4.7124 }   # the rotary stage, in rad/s: 0.75 turns/s
    joint2: { axis: 1, scale: 18.8496 }  # the rail, in rad/s of its motor: 3 turns/s
    joint3: { axis: -1, scale: 0.0 }
    joint4: { axis: -1, scale: 0.0 }
    joint5: { axis: -1, scale: 0.0 }
    joy_timeout: 0.5
