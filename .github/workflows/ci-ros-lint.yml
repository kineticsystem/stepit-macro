# The ament linters of the rig's packages, both workspaces. They need a ROS
# installation, but not the packages' dependencies: they read the sources only.

name: ROS Lint

on: [push, pull_request]

jobs:
  ament_lint:
    name: ament_${{ matrix.linter }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        linter: [copyright, lint_cmake]
    steps:
      - uses: actions/checkout@v4
      - uses: ros-tooling/setup-ros@v0.7
      - uses: ros-tooling/action-ros-lint@v0.1
        with:
          distribution: jazzy
          linter: ${{ matrix.linter }}
          package-name: stepit_behaviors
            stepit_objectives
            stepit_tests
            stepit_teleop
            stepit_macro_tests

  ament_lint_121:
    name: ament_${{ matrix.linter }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        linter: [cpplint]
    steps:
      - uses: actions/checkout@v4
      - uses: ros-tooling/setup-ros@v0.7
      - uses: ros-tooling/action-ros-lint@v0.1
        with:
          distribution: jazzy
          linter: cpplint
          # As in .pre-commit-config.yaml: cpplint takes any header ending in .h
          # for a C system header, and BehaviorTree.CPP ships its C++ headers
          # that way.
          arguments: "--linelength=121 --filter=-whitespace/newline,-build/include_order"
          package-name: stepit_behaviors
            stepit_objectives
            stepit_tests
            stepit_teleop
            stepit_macro_tests
