# Builds and tests the rig's two workspaces with the scripts of ../../bin, in a
# plain ROS image:
#
# - src/plugins, on top of the commander's workspace, which is built first from
#   the stepit-commander submodule, and of the messages of StepIt Freezer, built
#   from the stepit-freezer submodule; in the container, it is on top of the
#   modules' workspace, which holds both;
# - src/stepit-macro, with the commander's interfaces, which it builds from the
#   same submodule.
#
# StepIt UI, ui/, the rig's page, is type checked, tested and built by a job of
# its own, as it needs Node.js and no ROS.
#
# The modules are not built here: each has its own CI.
#
# industrial_ci, which the modules use, builds one workspace from the sources
# of the repo: it cannot build one on top of a submodule's.
#
# The Debian packages the jobs download, mostly rosdep's, are kept in the
# Actions cache, so that the next run installs them without downloading them.
# A job restores the newest cache of its own, and saves a new one, named after
# the packages it then holds, only when it downloaded any. The ROS image
# deletes every package after installing it: the jobs delete that setting,
# docker-clean, first.

name: CI

on: [push, pull_request]

jobs:
  build:
    name: ${{ matrix.workspace }}
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    strategy:
      fail-fast: false
      matrix:
        workspace: [plugins, stepit-macro]
    defaults:
      run:
        shell: bash
    env:
      # The workspace that bin/plugins builds on: the messages of StepIt
      # Freezer, on top of the commander's.
      UNDERLAY: ${{ github.workspace }}/install/freezer-msgs
    steps:
      - name: Keep the downloaded packages
        run: rm /etc/apt/apt.conf.d/docker-clean
      - uses: actions/cache/restore@v4
        with:
          path: /var/cache/apt/archives/*.deb
          key: apt-${{ matrix.workspace }}-
          restore-keys: apt-${{ matrix.workspace }}-
      - name: Install git
        run: apt-get update -qq && apt-get install -qq -y git
      - uses: actions/checkout@v4
      # Only the commander's submodule, with its own BehaviorTree.ROS2: the
      # other modules have their own CI. .gitmodules lists SSH URLs, which the
      # runner cannot use: the repositories are public, so HTTPS needs no key.
      - name: Check out the commander
        run: |
          git config --global --add safe.directory '*'
          git config --global url.https://github.com/.insteadOf git@github.com:
          git submodule update --init --recursive --depth 1 modules/stepit-commander
      # The behaviors also send goals to StepIt Freezer: only its messages are
      # built, so its own submodules are not needed.
      - name: Check out StepIt Freezer
        if: matrix.workspace == 'plugins'
        run: git submodule update --init --depth 1 modules/stepit-freezer
      - name: Build the commander
        if: matrix.workspace == 'plugins'
        run: |
          modules/stepit-commander/bin/update.sh
          modules/stepit-commander/bin/build.sh
      # On top of the commander's workspace, whose setup.bash this one's then
      # sources too: UNDERLAY names this one alone.
      - name: Build the messages of StepIt Freezer
        if: matrix.workspace == 'plugins'
        run: |
          source modules/stepit-commander/install/setup.bash
          rosdep install --ignore-src --from-paths modules/stepit-freezer/src/freezer_msgs -y -r
          colcon build --base-paths modules/stepit-freezer/src/freezer_msgs \
            --build-base build/freezer-msgs --install-base install/freezer-msgs --event-handlers log-
      - name: Install the dependencies
        run: bin/${{ matrix.workspace }}/update.sh
      - name: Name the downloaded packages
        id: packages
        run: |
          apt-get autoclean -qq   # Drops the versions the repositories no longer serve.
          # Empty when there is no package, which skips saving.
          if ls /var/cache/apt/archives/*.deb &>/dev/null; then
            echo "hash=$(ls /var/cache/apt/archives/*.deb | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/cache/save@v4
        if: steps.packages.outputs.hash != ''
        with:
          path: /var/cache/apt/archives/*.deb
          key: apt-${{ matrix.workspace }}-${{ steps.packages.outputs.hash }}
      - name: Build
        run: bin/${{ matrix.workspace }}/build.sh
      - name: Test
        run: bin/${{ matrix.workspace }}/test.sh

  # StepIt UI, with the scripts of bin/ui and the pnpm version its package.json
  # pins.
  ui:
    name: ui
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Install the dependencies
        run: bin/ui/update.sh
      - name: Test
        run: bin/ui/test.sh
      - name: Build
        run: bin/ui/build.sh

  # The rig's objectives, checked by the StepIt Editor's validator: the
  # editor's own checks, then BehaviorTree.CPP loading every file, with the
  # node models of the rig's behaviors, the library and the version the
  # commander loads them with. A broken objective, e.g. an unknown node or
  # port, or a missing subtree, fails here instead of on the robot.
  objectives:
    name: objectives
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    defaults:
      run:
        shell: bash
    steps:
      # nodejs runs the JavaScript actions below under act, which does not
      # provide one in a container as GitHub does, so it comes before the
      # cache; setup-node installs the Node.js the editor uses.
      - name: Install git and Node.js
        run: |
          rm /etc/apt/apt.conf.d/docker-clean
          apt-get update -qq && apt-get install -qq -y git nodejs
      - uses: actions/cache/restore@v4
        with:
          path: /var/cache/apt/archives/*.deb
          key: apt-objectives-
          restore-keys: apt-objectives-
      - name: Install BehaviorTree.CPP
        id: packages
        run: |
          apt-get install -qq -y ros-jazzy-behaviortree-cpp
          apt-get autoclean -qq
          # Empty when there is no package, which skips saving.
          if ls /var/cache/apt/archives/*.deb &>/dev/null; then
            echo "hash=$(ls /var/cache/apt/archives/*.deb | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/cache/save@v4
        if: steps.packages.outputs.hash != ''
        with:
          path: /var/cache/apt/archives/*.deb
          key: apt-objectives-${{ steps.packages.outputs.hash }}
      - uses: actions/checkout@v4
      # Only the editor's submodule, over HTTPS, as for the commander above.
      - name: Check out the editor
        run: |
          git config --global --add safe.directory '*'
          git config --global url.https://github.com/.insteadOf git@github.com:
          git submodule update --init --depth 1 modules/stepit-editor
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: modules/stepit-editor/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: modules/stepit-editor/pnpm-lock.yaml
      # Steps bypass the image's entrypoint, which would source ROS: the
      # validator needs it to build, and to find the library when it runs.
      - name: Build the validator
        working-directory: modules/stepit-editor
        run: |
          source /opt/ros/jazzy/setup.bash
          pnpm install --frozen-lockfile
          cmake -S validator -B build/validator -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=/opt/ros/jazzy
          cmake --build build/validator --parallel
      - name: Validate the objectives
        working-directory: modules/stepit-editor
        run: |
          source /opt/ros/jazzy/setup.bash
          pnpm run validate "$GITHUB_WORKSPACE/src/plugins/stepit_objectives/objectives"
