# The whole StepIt Macro rig, in one container: the robot, the commander, the
# camera, the Freezer board, the editor and the gamepad, all started by one
# launch file, stepit_bringup/rig.launch.py, and configured by one file,
# src/stepit-macro/stepit_bringup/config/rig.yaml.
# Driven by ./dock.sh, which supplies USER_UID/USER_GID, and the numbers of the
# host's groups input and plugdev, INPUT_GID/PLUGDEV_GID.
#
# Each module keeps its own container, for testing it alone: this one runs them
# all, built from the submodules under ../modules into the rig's own build
# folders (see ../bin/modules).
#
# The service installs the system packages its code needs (rosdep, i.e.
# `update.sh`) the first time its container starts, unless its image has them
# already: `dock.sh build` installs them while compiling, and saves that
# container as the service's image, marker file included. Both refresh the
# package lists first: the image's own come from a cached layer, and name
# versions that Ubuntu may since have replaced, which apt can no longer fetch.
# The marker file lives in the container, so a recreated container of an image
# without it installs them again.
#
# Every package apt downloads, while building the image or from rosdep, goes
# through apt-cache, a proxy that keeps it on this machine, so that it is
# downloaded only once. The service mounts its apt configuration, which falls
# back to the internet when the proxy is not running; `dock.sh build` starts it
# and passes it to the image build, which runs on the host network to reach it.

name: stepit-macro

services:
  # The package cache, on port 3142 of the host. Its packages are in the volume
  # apt-cache, which `dock.sh clean` keeps; `docker volume rm stepit-macro_apt-cache`
  # empties it.
  apt-cache:
    build: apt-cache
    image: stepit-apt-cache:latest
    container_name: stepit-apt-cache
    hostname: stepit-apt-cache
    init: true
    network_mode: host
    restart: unless-stopped
    volumes:
      - apt-cache:/var/cache/apt-cacher-ng

  # The whole rig. The web pages are on the ports of rig.yaml: the editor on
  # http://localhost:8080, the camera's test page on http://localhost:8090 and
  # the Freezer's board page on http://localhost:8092.
  stepit-macro:
    build:
      context: .
      network: host
      args:
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    image: stepit-macro:latest
    container_name: stepit-macro
    hostname: stepit-macro
    init: true
    # ros2 launch shuts its nodes down cleanly on SIGINT, as on Ctrl+C.
    stop_signal: SIGINT
    # No core dumps: a node that aborts while the rig stops, e.g. the commander
    # or joy_linux_node, would write one of about 140 MB into the working
    # folder, the mounted repo, at every stop.
    ulimits:
      core: 0
    # The devices: the serial ports of the robot and of the Freezer, the camera
    # through /dev/bus/usb, and the gamepad through /dev/input. Mounting the
    # whole of /dev, rather than each device, lets them be unplugged and plugged
    # in again while the container runs: they come back under new numbers.
    privileged: true
    # Privileged gives the container the devices, not their permissions: the
    # user opens a device only if the host lets it. It is the host's user, by
    # its uid, in dialout for the serial ports (see Dockerfile), and joins the
    # host's input, for the gamepad, and plugdev, for the cameras: groups whose
    # numbers differ between systems, which dock.sh reads from the host.
    # Without dock.sh, e.g. `docker compose exec`, they fall back to groups the
    # user is in anyway, two different ones: compose refuses the same twice.
    group_add:
      - "${INPUT_GID:-20}"
      - "${PLUGDEV_GID:-1000}"
    # The web pages reach the servers on the host's ports, and ROS2 nodes
    # outside the container, e.g. on the host, discover the rig over DDS.
    network_mode: host
    volumes:
      - ..:/home/developer/ws
      - /dev:/dev
      # RViz, on the host's display.
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      - ./apt-cache/apt-proxy.conf:/etc/apt/apt.conf.d/01proxy:ro
      - ./apt-cache/apt-proxy-detect:/usr/local/bin/apt-proxy-detect:ro
    environment:
      DISPLAY: ${DISPLAY:-}
      QT_X11_NO_MITSHM: 1
    command:
      - bash
      - -c
      - '{ [ -f ~/.dependencies ] || { sudo apt-get update && update.sh && touch ~/.dependencies; }; }
        && source /opt/ros/jazzy/setup.bash
        && source install/modules/setup.bash
        && source install/plugins/setup.bash
        && source install/stepit-macro/setup.bash
        && exec ros2 launch stepit_bringup rig.launch.py'

volumes:
  apt-cache:
