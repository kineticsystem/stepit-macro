# The whole StepIt Macro rig: the robot, the commander, the editor and the
# camera, each in the container defined by its own project.
# Driven by ./dock.sh, which supplies USER_UID/USER_GID.
#
# Every service extends the `dev` service of the project it runs, so the
# Dockerfiles, mounts and network settings stay defined in one place: the
# modules. Relative paths in an extended file resolve against that file, so
# each container still mounts its own module at ~/ws. Only what differs when
# they run together is set here: the dependencies between them, the folder
# the editor opens, and the command, which runs the application instead of
# `sleep infinity`. The containers and images are named after their modules, as
# each module's own dock.sh names them.
#
# The ROS2 services install the system packages their code needs (rosdep, i.e.
# `update.sh`) the first time their container starts. They cannot come from
# `dock.sh build`: it compiles in a throwaway container, so only what it writes
# into the bind-mounted module is kept. The marker file lives in the container,
# so a recreated container installs them again.

name: stepit-macro

services:
  # The robot: ros2_control with fake motors by default, and RViz.
  stepit-driver:
    extends:
      file: ../modules/stepit-driver/docker/docker-compose.yml
      service: dev
    image: stepit-driver:latest
    container_name: stepit-driver
    hostname: stepit-driver
    init: true
    # ros2 launch shuts its nodes down cleanly on SIGINT, as on Ctrl+C.
    stop_signal: SIGINT
    command:
      - bash
      - -c
      - '{ [ -f ~/.dependencies ] || { update.sh && touch ~/.dependencies; }; }
        && source /opt/ros/jazzy/setup.bash
        && source install/setup.bash
        && exec ros2 launch robot_bringup launch.py'

  # The action server running objectives on the robot, and rosbridge on port
  # 9090 for the editor.
  stepit-commander:
    extends:
      file: ../modules/stepit-commander/docker/docker-compose.yml
      service: dev
    image: stepit-commander:latest
    container_name: stepit-commander
    hostname: stepit-commander
    init: true
    stop_signal: SIGINT
    depends_on:
      - stepit-driver
    command:
      - bash
      - -c
      - '{ [ -f ~/.dependencies ] || { update.sh && touch ~/.dependencies; }; }
        && source /opt/ros/jazzy/setup.bash
        && source install/setup.bash
        && exec ros2 launch stepit_server commander.launch.py'

  # The web editor, on http://localhost:${EDITOR_PORT:-8080}.
  stepit-editor:
    extends:
      file: ../modules/stepit-editor/docker/docker-compose.yml
      service: dev
    image: stepit-editor:latest
    container_name: stepit-editor
    hostname: stepit-editor
    init: true
    depends_on:
      - stepit-commander
    volumes:
      # Edit the commander's own objectives: it reads them again before each
      # goal, so what the editor saves is what the Run button executes.
      - ../modules/stepit-commander/src/stepit_objectives/objectives:/home/developer/behaviors
    command: serve.sh

  # The camera driver, with its test page and the pictures on
  # http://localhost:8090, web_video_server on port 8081 and its own rosbridge
  # on port 9091. It needs the camera on USB: the container is privileged and
  # mounts /dev, see its compose file.
  stepit-camera:
    extends:
      file: ../modules/stepit-camera/docker/docker-compose.yml
      service: dev
    image: stepit-camera:latest
    container_name: stepit-camera
    hostname: stepit-camera
    init: true
    stop_signal: SIGINT
    command:
      - bash
      - -c
      - '{ [ -f ~/.dependencies ] || { update.sh && touch ~/.dependencies; }; }
        && source /opt/ros/jazzy/setup.bash
        && source install/setup.bash
        && exec ros2 launch stepit_camera camera.launch.py'
